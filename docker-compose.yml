services:
  web:
    build: .
    container_name: baseball-web
    ports:
      - "8000:8000"
    # Playwright(Chromium)がデフォルトの64MBだとクラッシュしやすいため拡張
    shm_size: '1gb'
    # SECRET_KEY などの設定を読み込む（.env.example をコピーして作成する）
    env_file:
      - .env
    volumes:
      # ソースをマウントすることで、編集内容が即座に反映される（ホットリロード）
      # db.sqlite3 もこのマウント経由でホスト側のファイルを直接使う
      - .:/app
    # 起動時に未適用のマイグレーションを反映してからサーバーを立ち上げる
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    # コンテナ内で pdb などの対話操作を使えるようにする
    stdin_open: true
    tty: true

  # React（frontend/）のビルド専用コンテナ。web イメージには Node を入れない。
  # dev server は使わず、watch ビルドで myapp/static/myapp/dist/ に常時出力し、
  # Django が静的ファイルとして配信する（docs/design/frontend-react-islands.md）
  frontend:
    image: node:22-bookworm-slim
    container_name: baseball-frontend
    working_dir: /app/frontend
    volumes:
      - .:/app
    command: sh -c "npm install && npm run watch"
