# テストを流し、main に入ったら本番イメージを GHCR に置く。
# テストと配布を1つのワークフローに置き、publish を test に `needs` でつなぐ
# （テストが落ちたコミットからはイメージを push しない。workflow_run で別ファイルにするより経路が1本で済む）。
# 手元と同じ環境で流すため、検査もテストも開発用 Dockerfile のイメージの中で動かす（CLAUDE.md の「すべてのコマンドは Docker 経由」）。
# 例外は ruff で、イメージを作らずに requirements-dev.txt と同じ版を流す（ドキュメントだけの変更でも流すため。#350）。
name: CI

# ワークフローは毎回動かし、テストに影響しない変更だけのときは test ジョブの中のビルドとテストを飛ばす（下の changes ジョブ）。
# トリガーの paths-ignore で流さないと、必須のチェック test が報告されず、自動マージがいつまでも待つため（#244）。
# ruff だけは毎回流す。ruff は Markdown の中の Python のコード例も検査するので、ドキュメントだけの変更でも落ちうる（#350）。
# Terraform の検査は terraform.yml
on:
  pull_request:
  # main と epic の統合ブランチの先端を流す（並行した PR を続けてマージすると、単独では通っても組み合わせで壊れることがあるため）。
  # publish は main だけ（下の if）
  push:
    branches: [main, "epic/**"]
  # ブランチで本番イメージのビルドと push を試すため（このときはコミットのハッシュのタグだけ付く）
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR の古い実行は止める。push の実行は止めない（main は取りこぼすとその版のイメージが作られず、
# main と epic はマージごとに先端を確かめたいため）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/sumika157/baseball-league-manager

jobs:
  # 変更されたファイルがテストに影響するかを決める。UNAFFECTED_BY_TESTS は「テストに影響しないパス」の唯一の出典
  # （CLAUDE.md と open-pr スキルの手元の手順もここを見る）。テストが読むファイル（Makefile など）は入れない。
  # パターンは bash の [[ == ]] の形（* は / も含めて一致する）。手動実行と、比べる相手が無い push は常にテストする
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: テストに影響する変更があるか
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          UNAFFECTED_BY_TESTS: |
            docs/*
            *.md
            .claude/*
            infra/*
            scripts/*.ps1
            scripts/*.sh
            .github/workflows/wiki-sync.yml
            .github/workflows/terraform.yml
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "比べる相手が無いので、テストする"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # force push の後などで比べる相手が無いときは、差分を出せないのでテストする（黙って飛ばさない）
          if ! files=$(git -c core.quotePath=false diff --name-only "$base"...HEAD); then
            echo "差分を出せないので、テストする"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            unaffected=false
            while IFS= read -r pattern; do
              # shellcheck disable=SC2053  # パターンとして一致させる
              if [ -n "$pattern" ] && [[ "$file" == $pattern ]]; then
                unaffected=true
                break
              fi
            done <<< "$UNAFFECTED_BY_TESTS"
            if [ "$unaffected" = false ]; then
              echo "テストに影響する: $file"
              code=true
            fi
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # 必須のチェック。ジョブは毎回動かし、ruff は毎回、それ以外はテストに影響する変更のときだけ流す
  # （ジョブごとスキップすると成功扱いになり、ruff も流れないまま自動マージされる。#350）
  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ローカルの Makefile の CACHE_ENV と同じ。コンテナ（root）の生成物を作業ツリーに残さない
      CACHE_ENV: -e PYTHONPYCACHEPREFIX=/tmp/pycache -e RUFF_CACHE_DIR=/tmp/ruff-cache -e MYPY_CACHE_DIR=/tmp/mypy-cache
      # .env が無いので、compose を使わず docker run に必要な環境変数を直接渡す
      RUN_ENV: -e DJANGO_SECRET_KEY=ci-only -e DJANGO_DEBUG=True
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ruff はイメージを作らずに流す（ドキュメントだけの変更で数分のビルドを待たない）。版は requirements-dev.txt が出典
      - name: ruff check・ruff format --check
        run: |
          version=$(sed -n 's/^ruff==//p' requirements-dev.txt)
          test -n "$version"
          pipx run "ruff==$version" check .
          pipx run "ruff==$version" format --check .

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.changes.outputs.code == 'true'

      # 開発用イメージ。requirements*.txt と Playwright のレイヤーを Actions のキャッシュで使い回す
      - name: 開発用イメージをビルドする
        if: needs.changes.outputs.code == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: baseball-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      - name: mypy
        if: needs.changes.outputs.code == 'true'
        run: |
          # shellcheck disable=SC2086  # CACHE_ENV・RUN_ENV は複数の引数に分けて渡す
          docker run --rm -v "$PWD:/app" -w /app $CACHE_ENV $RUN_ENV baseball-dev mypy .

      # 出力先は vite.config.ts の outDir（myapp/static/myapp/dist）。e2e の前提になるのでテストより先に作る
      - name: React をビルドして型検査する
        if: needs.changes.outputs.code == 'true'
        run: |
          docker run --rm -v "$PWD:/app" -w /app/frontend node:22-bookworm-slim \
            sh -c "npm ci && npm run build && npm run typecheck"

      # フルスイートは Makefile の test と同じく2回に分ける。domain + integration は並列（CPU の数だけ子プロセス）
      - name: テスト（domain・integration。並列）
        if: needs.changes.outputs.code == 'true'
        run: |
          # shellcheck disable=SC2086  # CACHE_ENV・RUN_ENV は複数の引数に分けて渡す
          docker run --rm -v "$PWD:/app" -w /app $CACHE_ENV $RUN_ENV \
            baseball-dev python manage.py test myapp.tests.domain myapp.tests.integration --parallel auto

      # e2e（Playwright の Chromium）は直列。shm は compose と同じく広げる
      - name: テスト（e2e）
        if: needs.changes.outputs.code == 'true'
        run: |
          # shellcheck disable=SC2086  # CACHE_ENV・RUN_ENV は複数の引数に分けて渡す
          docker run --rm --shm-size=1g -v "$PWD:/app" -w /app $CACHE_ENV $RUN_ENV \
            baseball-dev python manage.py test myapp.tests.e2e

  # 本番イメージ。main への push と手動実行だけ。PR では動かさない（fork の PR に packages 権限を渡さないため）。
  # テストに影響しない変更だけのときは作らない（手動実行は changes が常に code を返す）
  publish:
    needs: [changes, test]
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 認証は GITHUB_TOKEN（個人のトークンは使わない）
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグはコミットのハッシュ。latest は main のときだけ（手動実行でブランチを試しても latest は動かない）
      - name: タグを決める
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE}:${GITHUB_SHA}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 本番イメージをビルドして push する
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # パッケージをこのリポジトリに結び付ける（リポジトリのページの Packages に出る。Wiki「本番公開」の公開の手順の前提）
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max
