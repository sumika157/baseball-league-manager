# docs/wiki/ の原稿を GitHub Wiki に反映する。
# Wiki の出典は docs/wiki/ だけにし、ドキュメントの更新を機能と同じ PR でレビューするため、
# Wiki 側の内容はここで丸ごと置き換える（Wiki の画面で直した内容は上書きされる）。
name: Wiki を反映する

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wiki のリポジトリは Web 画面で最初のページを作るまで存在しない（その場合はここで失敗する）
      - name: Wiki のリポジトリを取得する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: 原稿で置き換える
        run: |
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R docs/wiki/. wiki/

      - name: 差分があれば push する
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki に差分はありません"
            exit 0
          fi
          git commit -m "docs/wiki を反映 (${GITHUB_SHA::7})"
          git push origin HEAD
