{% extends 'myapp/base.html' %}

{% block title %}パスワード再設定 - Baseball Manager{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="card">
    <div class="card-body">
      <h1 class="auth-title">パスワードの再設定</h1>
      <p class="page-subtitle mb-4" style="font-size: 0.875rem;">
        登録しているメールアドレスを入力してください。再設定用のリンクをお送りします。
      </p>
      <form method="post" class="form-stack">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-2">送信する</button>
      </form>
      <p class="text-center mt-3 mb-0" style="font-size: 0.875rem;">
        <a href="{% url 'login' %}">ログイン画面へ戻る</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
