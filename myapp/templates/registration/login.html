{% extends 'myapp/base.html' %}

{% block title %}ログイン - Baseball Manager{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="card">
    <div class="card-body">
      <h1 class="auth-title">ログイン</h1>
      <form method="post" class="form-stack">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit" class="btn btn-primary w-100 mt-2">ログイン</button>
      </form>
      <p class="text-center mt-3 mb-0" style="font-size: 0.875rem;">
        <a href="{% url 'signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">新規登録はこちら</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
