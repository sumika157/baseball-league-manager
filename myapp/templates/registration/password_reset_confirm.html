{% extends 'myapp/base.html' %}

{% block title %}新しいパスワードの設定 - Baseball Manager{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="card">
    <div class="card-body">
      {% if validlink %}
        <h1 class="auth-title">新しいパスワードの設定</h1>
        <form method="post" class="form-stack">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100 mt-2">設定する</button>
        </form>
      {% else %}
        <h1 class="auth-title">リンクが無効です</h1>
        <p class="page-subtitle text-center mb-4">
          この再設定リンクは既に使用済みか、有効期限が切れています。<br />
          お手数ですが、もう一度やり直してください。
        </p>
        <a href="{% url 'password_reset' %}" class="btn btn-primary w-100">再設定をやり直す</a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
