{% extends 'myapp/base.html' %}

{% block title %}パスワード変更 - Baseball Manager{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="card">
    <div class="card-body">
      <h1 class="auth-title">パスワードの変更</h1>
      <form method="post" class="form-stack">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-2">変更する</button>
      </form>
      <p class="text-center mt-3 mb-0" style="font-size: 0.875rem;">
        <a href="{% url 'team_list' %}">チーム一覧へ戻る</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
