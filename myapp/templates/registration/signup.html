{% extends 'myapp/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">新規登録</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">登録する</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}">ログインはこちら</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
