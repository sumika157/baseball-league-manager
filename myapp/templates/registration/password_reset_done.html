{% extends 'myapp/base.html' %}

{% block title %}メールを送信しました - Baseball Manager{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="card">
    <div class="card-body text-center">
      <h1 class="auth-title">メールを送信しました</h1>
      <p class="page-subtitle mb-4">
        再設定用のリンクを記載したメールをお送りしました。<br />
        届かない場合は迷惑メールフォルダをご確認ください。
      </p>
      <a href="{% url 'login' %}" class="btn btn-secondary w-100">ログイン画面へ戻る</a>
    </div>
  </div>
</div>
{% endblock %}
