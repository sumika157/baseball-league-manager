{% comment %}
403 は CSRF の検査に落ちたときなどに描画される。400 と同じく、コンテキストプロセッサに依存しないよう
base.html を継承せず単独で完結させる
{% endcomment %}
{% load static %}
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>この操作はできません - Baseball Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="{% static 'myapp/css/theme.css' %}" rel="stylesheet" />
  </head>
  <body>
    <header class="app-header">
      <div class="container">
        <a class="app-brand" href="/">
          <span class="app-brand-mark">⚾</span>
          Baseball Manager
        </a>
      </div>
    </header>

    <main class="container">
      <div class="auth-shell">
        <div class="card">
          <div class="card-body text-center">
            <h1 class="auth-title">この操作はできません</h1>
            <p class="page-subtitle mb-4">
              セッションの有効期限が切れたか、操作する権限がありません。ページを再読み込みして、もう一度お試しください。
            </p>
            <a href="/" class="btn btn-primary w-100">チーム一覧へ</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
