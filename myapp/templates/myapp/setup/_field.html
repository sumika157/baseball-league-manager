{% comment %}フォームの項目1つ（ラベル・入力欄・補足・エラー）。field を渡す。{% endcomment %}
<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="stat-muted mt-1" style="font-size: 0.8125rem;">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}
    <div class="text-danger" style="font-size: 0.8125rem;">{{ error }}</div>
  {% endfor %}
</div>
