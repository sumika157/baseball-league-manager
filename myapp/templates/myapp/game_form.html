{% extends 'myapp/base.html' %}

{% block title %}試合の登録 - Baseball Manager{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">ダッシュボード</a></li>
    <li class="breadcrumb-item"><a href="{% url 'game_list' %}">試合</a></li>
    <li class="breadcrumb-item active">登録</li>
  </ol>
</nav>

<div class="page-head">
  <h1 class="page-title">試合の登録</h1>
  <p class="page-subtitle">まず対戦カードを登録します。得点と選手の成績は、次のスコアブック画面で打席を記録すると自動で決まります。</p>
</div>

<form method="POST">
  {% csrf_token %}

  <div class="card mb-3">
    <div class="card-header">対戦カード</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">シーズン</label>
          <input type="number" name="year" class="form-control"
                 value="{{ form.year.value|default_if_none:'' }}" required />
        </div>
        <div class="col-md-3">
          <label class="form-label">試合日</label>
          <input type="date" name="played_on" class="form-control"
                 value="{{ form.played_on.value|default_if_none:'' }}" required />
        </div>
      </div>

      <div class="row g-3 mt-1 align-items-end">
        <div class="col-md-6">
          <label class="form-label">ホーム</label>
          <select name="home_team" class="form-select" required>
            <option value="">選択してください</option>
            {% for team in teams %}
              <option value="{{ team.id }}"
                      {% if team.id|stringformat:'s' == form.home_team.value|stringformat:'s' %}selected{% endif %}>
                {{ team.league_name }} · {{ team.name }}
              </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">ビジター</label>
          <select name="away_team" class="form-select" required>
            <option value="">選択してください</option>
            {% for team in teams %}
              <option value="{{ team.id }}"
                      {% if team.id|stringformat:'s' == form.away_team.value|stringformat:'s' %}selected{% endif %}>
                {{ team.league_name }} · {{ team.name }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between">
    <a href="{% url 'game_list' %}" class="btn btn-secondary">戻る</a>
    <button type="submit" class="btn btn-primary">登録してスコアブックへ</button>
  </div>
</form>
{% endblock %}
