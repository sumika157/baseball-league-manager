[tool.ruff]
target-version = "py310"
line-length = 119
exclude = ["myapp/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["myapp/migrations"]

[tool.django-stubs]
django_settings_module = "config.settings"
